<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Для тебя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* =====================================================================
   ТВОИ НАСТРОЙКИ — меняй только этот блок
   ===================================================================== */
const CONFIG = {
  me: "Я",                       // как подписан ты (1–2 буквы)
  her: "Солнышко",               // её имя
  herIcon: "☀️",                 // что написано в её кружочке
  together: "2024-08-25",        // дата, когда вы вместе, в формате "2025-02-14" (пусто = ∞)

  startText: "Солнышко, у меня есть кое-что для тебя…",
  finalTitle: "Я тебя люблю",
  finalText: "Ты самое лучшее, что со мной случалось 💗",

  music: "music.mp3",            // mp3-файл, загруженный рядом с index.html (если файла нет — открытка просто без музыки)
  musicStart: 65,                // с какой секунды песни начинать (1:05 — как в видео)
  songLabel: "MiyaGi & Эндшпиль · Фея", // подпись сверху

  // Карточки по порядку. at — на какой секунде (от начала музыки) появляется карточка.
  // В title слова в *звёздочках* подсвечиваются цветом.
  // Типы: question, nav, pulse, split, transfer, gift, certificate, delivery, battery, message, weather, calendar
  // question с auto: true сам нажимает «Да»; без auto — ждёт, пока она нажмёт (тогда ставь его последним).
  scenes: [
    { type: "question",    at: 0,     auto: true, title: "Это *любовь?*" },
    { type: "nav",         at: 2.0,   title: "Уже *лечу* к тебе" },
    { type: "pulse",       at: 4.75,  title: "Сердце бьётся *чаще*" },
    { type: "split",       at: 7.0,   title: "*Весь* *мир* — пополам" },
    { type: "transfer",    at: 9.5,   title: "Всё, что есть, — *тебе*" },
    { type: "gift",        at: 12.25, title: "Дарю тебе *своё* *сердце*" },
    { type: "certificate", at: 18.5,  title: "Ты моя *единственная*" },
    { type: "delivery",    at: 22.0,  title: "Любовь *уже* *в* *пути*" }
  ],
  endAt: 28.25                   // на какой секунде показать финальный экран
};
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0820;color:#fff;
    font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .bg{position:fixed;inset:0;opacity:0;transition:opacity 1.2s ease}
  .bg.on{opacity:1}
  .bg.pink  {background:radial-gradient(130% 85% at 50% 115%,#ff8a5c 0%,#c23a9e 32%,#4a1d7a 65%,#140b2e 100%)}
  .bg.green {background:radial-gradient(130% 85% at 50% 115%,#e8733a 0%,#3a6f74 34%,#1f2f5c 66%,#0c1027 100%)}
  .bg.blue  {background:radial-gradient(130% 85% at 50% 115%,#e07a8f 0%,#5466c4 36%,#25306f 66%,#0c1030 100%)}
  .bg.sun   {background:radial-gradient(130% 85% at 50% 115%,#ffc15c 0%,#e0623f 32%,#5c2352 66%,#160b24 100%)}
  .bg.red   {background:radial-gradient(130% 85% at 50% 115%,#ff8a6a 0%,#b8234a 32%,#3d0f35 66%,#120614 100%)}
  .bg.violet{background:radial-gradient(130% 85% at 50% 115%,#ea8ed4 0%,#7348c8 34%,#2b1a6e 66%,#0e0a2c 100%)}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  .song{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:14px;font-weight:700;opacity:0;transition:opacity 1s}
  .song.on{opacity:.85}
  .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:7px}
  .eq i{width:3px;height:3px;background:#fff;border-radius:2px;animation:eq .8s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.55s}.eq i:nth-child(4){animation-delay:-.15s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .mute{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top));right:10px;width:36px;height:36px;border-radius:50%;
    border:0;background:rgba(255,255,255,.12);color:#fff;font-size:16px;display:none;cursor:pointer}
  .mute.on{display:block}

  .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
    padding:calc(62px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .6s ease}
  .scene.on{opacity:1;pointer-events:auto}

  .title{font-size:clamp(32px,10vw,50px);font-weight:900;letter-spacing:-.025em;text-align:center;
    line-height:1.05;margin:0;max-width:520px;text-shadow:0 4px 30px rgba(0,0,0,.35)}
  .title span{display:inline-block;margin:0 .12em;opacity:0;transform:translateY(26px) scale(.85);filter:blur(10px)}
  .scene.on .title span{animation:word .75s cubic-bezier(.2,.9,.3,1.35) forwards}
  @keyframes word{to{opacity:1;transform:none;filter:none}}
  .hl{color:var(--accent);text-shadow:0 0 26px var(--accent)}

  .cardwrap{position:relative;perspective:900px;width:min(100%,420px);margin:auto 0}
  .card{position:relative;border-radius:30px;padding:22px;overflow:hidden;
    background:linear-gradient(155deg,var(--c1),var(--c2));
    border:1.5px solid var(--edge);
    box-shadow:0 0 45px var(--glow),inset 0 1px 0 rgba(255,255,255,.15),0 24px 60px rgba(0,0,0,.5);
    opacity:0;transform:rotateX(18deg) rotateY(-14deg) scale(.7) translateY(70px)}
  .scene.on .card{animation:cardIn .7s .15s cubic-bezier(.2,.9,.25,1.15) forwards,float 4.5s .85s ease-in-out infinite}
  @keyframes cardIn{to{opacity:1;transform:rotateX(5deg) rotateY(-7deg)}}
  @keyframes float{0%,100%{transform:rotateX(5deg) rotateY(-7deg)}50%{transform:rotateX(-3deg) rotateY(5deg) translateY(-8px)}}
  .card::after{content:"";position:absolute;top:-30%;bottom:-30%;width:32%;left:-70%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg)}
  .scene.on .card::after{animation:shine 3.4s 1.3s ease-in-out infinite}
  @keyframes shine{0%{left:-70%}45%,100%{left:140%}}
  .card.pink  {--c1:#5e1656;--c2:#260a3a;--edge:rgba(255,120,240,.55);--glow:rgba(255,60,220,.65)}
  .card.green {--c1:#0e5d3c;--c2:#0a2620;--edge:rgba(90,255,170,.5);--glow:rgba(40,255,150,.55)}
  .card.blue  {--c1:#1f3d96;--c2:#0d1944;--edge:rgba(140,170,255,.5);--glow:rgba(100,150,255,.6)}
  .card.sun   {--c1:#7a3d0c;--c2:#2e1405;--edge:rgba(255,200,90,.55);--glow:rgba(255,170,40,.6)}
  .card.red   {--c1:#6a0f1e;--c2:#2a0610;--edge:rgba(255,90,110,.55);--glow:rgba(255,50,80,.6)}
  .card.violet{--c1:#3d1a8a;--c2:#170a3a;--edge:rgba(180,140,255,.55);--glow:rgba(150,100,255,.6)}

  .deco{position:absolute;font-size:40px;z-index:3;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(8deg)}}

  .label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
  .center{text-align:center}
  .top{display:flex;justify-content:space-between;align-items:center}
  .foot{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
  .row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:18px;padding:10px 12px}
  .ava{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;
    background:linear-gradient(135deg,#ff7ade,#c2185b);box-shadow:0 0 0 3px rgba(255,255,255,.2)}
  .ava.me{background:linear-gradient(135deg,#7fa2ff,#3b5bd6)}
  .row b{display:block;font-size:17px}.row small{opacity:.6;font-size:12px}
  .btn{display:block;margin-top:12px;height:54px;border-radius:18px;border:0;width:100%;font:inherit;font-weight:800;font-size:17px;
    color:#fff;background:linear-gradient(90deg,#ff3ccf,#cf1fb4);box-shadow:0 0 26px rgba(255,60,220,.6);
    position:relative;overflow:hidden;transition:transform .15s;cursor:pointer}
  .btn.press{transform:scale(.94)}
  .btn:disabled{opacity:.6}
  .ripple{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;
    border:2px solid #fff;background:rgba(255,255,255,.3);animation:rip .7s forwards;pointer-events:none}
  @keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
  .big{font-size:clamp(56px,17vw,76px);font-weight:900;line-height:.95;letter-spacing:-.03em;text-shadow:0 0 22px var(--glow)}
  .big small{font-size:15px;font-weight:700;opacity:.8;letter-spacing:0}
  .bigrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}

  /* gift */
  .bigheart{font-size:110px;line-height:1;margin:14px 0 16px;text-align:center;animation:beat 1.1s ease-in-out infinite;
    filter:drop-shadow(0 0 22px rgba(255,80,200,.8))}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(.97)}45%{transform:scale(1.08)}}
  .mini{position:absolute;bottom:30%;font-size:16px;pointer-events:none;animation:rise 2.4s ease-out forwards}
  @keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-170px) scale(1.1);opacity:0}}

  /* split */
  .amount{font-size:clamp(40px,12vw,54px);font-weight:900;margin:2px 0 14px;letter-spacing:-.02em;text-shadow:0 0 20px var(--glow)}
  .bar{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#3cffa0,#b6ffd9);box-shadow:0 0 16px #3cffa0;transition:width 2s cubic-bezier(.4,0,.2,1)}
  .halves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .half{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border-radius:16px;padding:10px;font-weight:800;font-size:14px;white-space:nowrap}
  .half .ava{width:30px;height:30px;font-size:11px}

  /* nav */
  .car{font-size:50px;display:inline-block}
  .car.go{animation:shake .12s linear infinite}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}75%{transform:translate(1px,-1px)}}
  .track{position:relative;height:50px;margin:16px 0 10px;background:rgba(255,255,255,.08);border-radius:25px}
  .line{position:absolute;left:30px;right:30px;top:50%;height:3px;margin-top:-1.5px;background:rgba(255,255,255,.2)}
  .line i{display:block;height:100%;width:0;background:#9fb6ff;box-shadow:0 0 10px #9fb6ff;transition:width 2.6s cubic-bezier(.6,0,.2,1)}
  .dot{position:absolute;top:6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  .dot.me{left:6px;background:#7f9cff;transition:left 2.6s cubic-bezier(.6,0,.2,1);z-index:2}
  .dot.her{right:6px;background:#ff4fb0}

  /* battery */
  .batt{position:relative;height:80px;border:3px solid rgba(255,255,255,.75);border-radius:20px;margin:18px 16px 14px 0;padding:5px;box-sizing:border-box}
  .batt::after{content:"";position:absolute;right:-13px;top:24px;width:8px;height:26px;border-radius:0 6px 6px 0;background:rgba(255,255,255,.75)}
  .batt i{display:block;height:100%;width:3%;border-radius:13px;background:linear-gradient(90deg,#ffd34d,#ff9a2e);box-shadow:0 0 20px #ffb03a}
  .batt b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .bolt{font-size:30px;animation:beat .9s infinite}

  /* message */
  .chat{display:flex;flex-direction:column;gap:8px;margin-top:14px;min-height:178px}
  .bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:16px;font-weight:600;animation:bubIn .45s cubic-bezier(.2,.9,.3,1.4) both}
  .bub.her{align-self:flex-start;background:rgba(255,255,255,.14);border-bottom-left-radius:6px}
  .bub.me{align-self:flex-end;background:linear-gradient(135deg,#9a7bff,#5a3bd6);border-bottom-right-radius:6px;box-shadow:0 0 18px rgba(150,100,255,.5)}
  .typing{display:inline-flex;gap:4px;padding:14px 16px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;animation:dots 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dots{50%{opacity:1;transform:translateY(-3px)}}
  @keyframes bubIn{from{opacity:0;transform:translateY(14px) scale(.8)}}

  /* pulse */
  .ecg{width:100%;height:76px;margin:10px 0 8px;overflow:visible}
  .ecg path{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .ecg .base{stroke:rgba(255,255,255,.15)}
  .ecg .run{stroke:#ff5a7a;filter:drop-shadow(0 0 6px #ff5a7a);stroke-dasharray:40 100;stroke-dashoffset:140;animation:ecg 1.6s linear infinite}
  @keyframes ecg{to{stroke-dashoffset:0}}
  .hb{font-size:46px;display:inline-block;animation:beat 1s infinite}

  /* weather */
  .sunicon{font-size:64px;display:inline-block;animation:spin 9s linear infinite;filter:drop-shadow(0 0 22px #ffb030)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
  .hours div{background:rgba(0,0,0,.22);border-radius:14px;padding:8px 0;text-align:center;opacity:0;transform:translateY(10px)}
  .scene.on .hours div{animation:word .5s forwards}
  .hours small{display:block;font-size:10px;opacity:.7;margin-bottom:4px}
  .hours span{font-size:20px}

  /* calendar */
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
  .grid7 i{aspect-ratio:1;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px;font-style:normal}
  .scene.on .grid7 i{animation:lit .4s forwards}
  @keyframes lit{to{background:linear-gradient(135deg,#b48cff,#7a4dff);box-shadow:0 0 10px rgba(160,120,255,.7)}}

  /* transfer, certificate */
  .items{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font-weight:700;transition:background .3s}
  .item small{display:block;opacity:.6;font-size:11px;font-weight:600}
  .chk{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:transparent;transition:.3s cubic-bezier(.3,1.6,.5,1)}
  .item.done{background:rgba(255,255,255,.2)}
  .item.done .chk{background:var(--accent);color:#2a1030;transform:scale(1.15)}

  /* delivery */
  .steps{display:flex;flex-direction:column;gap:11px;margin:16px 0}
  .step{display:flex;align-items:center;gap:10px;font-weight:700;opacity:.5;transition:opacity .3s}
  .step i{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:12px;font-style:normal;transition:.3s}
  .step.done{opacity:1}
  .step.done i{background:#b48cff;border-color:#b48cff;box-shadow:0 0 10px #b48cff}
  .step.done i::after{content:"✓"}

  /* question */
  .q{text-align:center;font-size:24px;font-weight:900;margin-top:4px}
  .sub{opacity:.6;font-size:14px;text-align:center;margin-top:4px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .choices .btn{margin:0}
  .btn.no{background:rgba(255,255,255,.13);box-shadow:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .btn.yes{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

  .envelope{font-size:110px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,90,200,.7))}
  .startbox,.finalbox{margin:auto 0;text-align:center;width:min(100%,380px)}
  .startbox p,.finalbox p{font-size:20px;font-weight:700;opacity:.9;margin:10px 0 24px}
  .finalbox h2{font-size:clamp(34px,10vw,48px);font-weight:900;margin:8px 0 0;color:#ff7ade;text-shadow:0 0 30px #ff3ccf}
  .scene.on .finalbox{animation:pop .9s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

  .fly{position:fixed;z-index:50;pointer-events:none;font-size:26px;animation:fly 1.6s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.15);opacity:0}}
</style>
</head>
<body>

<div class="bg pink on" id="bg-pink"></div>
<div class="bg green" id="bg-green"></div>
<div class="bg blue" id="bg-blue"></div>
<div class="bg sun" id="bg-sun"></div>
<div class="bg red" id="bg-red"></div>
<div class="bg violet" id="bg-violet"></div>
<canvas id="fx"></canvas>

<div class="song" id="song"><span class="eq"><i></i><i></i><i></i><i></i></span><span id="songText"></span></div>
<button class="mute" id="mute">🔊</button>

<section class="scene on" data-bg="pink" id="sStart">
  <div class="startbox">
    <div class="envelope">💌</div>
    <p id="startText"></p>
    <button class="btn" id="openBtn">Открыть</button>
  </div>
</section>

<div id="stage"></div>

<section class="scene" data-bg="pink" id="sEnd">
  <div class="finalbox">
    <div class="envelope" style="animation:beat 1.1s infinite">💖</div>
    <h2 id="finalTitle"></h2>
    <p id="finalText"></p>
    <button class="btn" id="againBtn" style="background:rgba(255,255,255,.14);box-shadow:none">Посмотреть ещё раз</button>
  </div>
</section>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#140b2e"); tg.setBackgroundColor("#140b2e"); } catch (e) {} }
const haptic = (t) => { try { t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred(t || "medium"); } catch (e) {} };

const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ME = CONFIG.me.slice(0, 2), HER = CONFIG.herIcon || CONFIG.her.slice(0, 3);
const ACCENT = { pink: "#ff6fe0", green: "#5dffb0", blue: "#8fb0ff", sun: "#ffc04d", red: "#ff6b81", violet: "#b99bff" };

$("#startText").textContent = CONFIG.startText;
$("#finalTitle").textContent = CONFIG.finalTitle;
$("#finalText").textContent = CONFIG.finalText;
$("#songText").textContent = CONFIG.songLabel;

function count(el, from, to, ms, fmt) {
  return new Promise((done) => {
    const t0 = performance.now();
    (function step(t) {
      const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (to - from) * e);
      p < 1 ? requestAnimationFrame(step) : done();
    })(t0);
  });
}
function burst(x, y, n, set) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "fly";
    s.textContent = set[Math.floor(Math.random() * set.length)];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.fontSize = 18 + Math.random() * 20 + "px";
    s.style.setProperty("--dx", (Math.random() - 0.5) * 340 + "px");
    s.style.setProperty("--dy", -60 - Math.random() * 320 + "px");
    s.style.setProperty("--r", (Math.random() - 0.5) * 120 + "deg");
    s.style.animationDelay = Math.random() * 0.15 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1900);
  }
}
const center = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
async function tap(btn) {
  const r = document.createElement("span"); r.className = "ripple"; btn.appendChild(r);
  btn.classList.add("press"); haptic("light");
  await sleep(160); btn.classList.remove("press");
  setTimeout(() => r.remove(), 700);
}

/* ====== карточки ====== */
let K = 1; // во сколько раз ускорить анимацию карточки, если ей мало времени
const w = (ms) => sleep(ms * K);
const cnt = (el, a, b, ms, f) => count(el, a, b, ms * K, f);

function titleHTML(t) {
  return t.split(" ").map((w, i) => {
    const hl = w.includes("*"); w = w.replace(/\*/g, "");
    return `<span class="${hl ? "hl" : ""}" style="animation-delay:${0.1 + i * 0.13}s">${w}</span>`;
  }).join("");
}
function build() {
  $("#stage").innerHTML = CONFIG.scenes.map((s, i) => {
    const T = TYPES[s.type];
    return `<section class="scene" id="sc${i}" data-bg="${T.theme}" ${s.auto ? "data-auto" : ""} style="--accent:${ACCENT[T.theme]}">
      <h1 class="title">${titleHTML(s.title)}</h1>
      <div class="cardwrap">${T.deco.map(([e, st]) => `<div class="deco" style="${st}">${e}</div>`).join("")}
        <div class="card ${T.theme}" data-type="${s.type}">${T.html()}</div></div></section>`;
  }).join("");
}
function show(s) {
  document.querySelectorAll(".scene").forEach((x) => x.classList.toggle("on", x === s));
  document.querySelectorAll(".bg").forEach((b) => b.classList.toggle("on", b.id === "bg-" + s.dataset.bg));
}

// сердечки внутри карточки подарка
setInterval(() => {
  const card = $(".scene.on .card[data-type=gift]"); if (!card) return;
  const m = document.createElement("span"); m.className = "mini";
  m.textContent = ["❤️", "💕", "💗", "🌹"][Math.floor(Math.random() * 4)];
  m.style.left = 10 + Math.random() * 80 + "%";
  card.appendChild(m); setTimeout(() => m.remove(), 2500);
}, 260);

/* ====== музыка ====== */
// песня скачивается целиком заранее, чтобы в Telegram она не обрывалась на середине
let audio = null, audioReady = true;
if (CONFIG.music) {
  audio = new Audio(); audio.preload = "auto"; audio.loop = true; audioReady = false;
  const btn = $("#openBtn"); btn.disabled = true; btn.textContent = "Загрузка… 🎵";
  const ready = () => { if (audioReady) return; audioReady = true; btn.disabled = false; btn.textContent = "Открыть"; };
  fetch(CONFIG.music).then((r) => { if (!r.ok) throw 0; return r.blob(); })
    .then((b) => { if (audioReady) return; audio.src = URL.createObjectURL(b); audio.addEventListener("loadedmetadata", ready, { once: true }); audio.load(); })
    .catch(() => { if (!audioReady) { audio.src = CONFIG.music; ready(); } });
  setTimeout(() => { if (!audioReady) { audio.src = CONFIG.music; ready(); } }, 12000);
  audio.addEventListener("loadedmetadata", () => { if (playing && audio.currentTime < CONFIG.musicStart - 1) audio.currentTime = CONFIG.musicStart; });
}
let playing = false;
function startMusic() {   // вызывается прямо в нажатии, иначе телефон не даст включить звук
  if (!audio) return Promise.resolve(false);
  playing = true;
  try { audio.currentTime = CONFIG.musicStart; } catch (e) {}
  return audio.play().then(() => {
    $("#mute").classList.add("on"); if (CONFIG.songLabel) $("#song").classList.add("on"); return true;
  }).catch(() => false);
}
$("#mute").addEventListener("click", () => { audio.muted = !audio.muted; $("#mute").textContent = audio.muted ? "🔇" : "🔊"; });

/* ====== сценарий ====== */
// карточки идут по времени песни: если песня подвиснет, карточки подождут её (но не дольше 2 секунд)
let t0 = 0, useAudio = false;
const clock = () => {
  const timer = (performance.now() - t0) / 1000;
  return useAudio ? Math.max(audio.currentTime - CONFIG.musicStart, timer - 2) : timer;
};
const until = (t) => new Promise((r) => (function f() { clock() >= t ? r() : setTimeout(f, 20); })());

let runId = 0;
async function run(music) {
  const id = ++runId;
  build(); noTries = 0;
  useAudio = await music;
  t0 = performance.now();
  for (let i = 0; i < CONFIG.scenes.length; i++) {
    const s = CONFIG.scenes[i];
    await until(s.at || 0);
    if (id !== runId) return;
    const el = $("#sc" + i);
    show(el);
    if (s.type === "question" && !s.auto) return;   // дальше ждём «Да»
    const next = CONFIG.scenes[i + 1], end = next ? next.at : (CONFIG.endAt || s.at + 6);
    K = Math.max(0.35, Math.min(1, (end - s.at) / 6));
    TYPES[s.type].play((sel) => el.querySelector(sel));
  }
  const last = CONFIG.scenes[CONFIG.scenes.length - 1];
  await until(CONFIG.endAt || (last.at || 0) + 6);
  if (id === runId) finale();
}

async function finale() {
  show($("#sEnd"));
  for (let i = 0; i < 5; i++) { burst(innerWidth * Math.random(), innerHeight * 0.75, 14, ["❤️", "💖", "💕"]); await sleep(350); }
}

// «Нет» убегает, «Да» растёт
let noTries = 0;
const noTexts = ["Нет", "Точно?", "Подумай 🥺", "Не-а", "Ну пожалуйста", "Ладно, жми «Да»"];
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-no]"); if (!b) return;
  e.preventDefault(); noTries++; haptic("light");
  b.textContent = noTexts[Math.min(noTries, noTexts.length - 1)];
  b.style.transform = `translate(${(Math.random() - 0.5) * 140}px,${-30 - Math.random() * 80}px) scale(${Math.max(0.55, 1 - noTries * 0.08)})`;
  b.parentElement.querySelector("[data-yes]").style.transform = `scale(${Math.min(1.45, 1 + noTries * 0.08)})`;
});
document.addEventListener("click", async (e) => {
  const y = e.target.closest("[data-yes]"); if (!y || y.closest("[data-auto]")) return;
  await tap(y); haptic("ok");
  burst(...center(y), 40, ["❤️", "💖", "💗", "💕", "🌹", "✨"]);
  runId++;
  await sleep(900);
  finale();
});

$("#openBtn").addEventListener("click", () => { const m = startMusic(); tap($("#openBtn")); run(m); });
$("#againBtn").addEventListener("click", () => run(startMusic()));

/* ====== светящиеся частицы на фоне ====== */
const cv = $("#fx"), ctx = cv.getContext("2d");
let W, H; const dots = [];
function resize() {
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", resize); resize();
const cols = ["255,240,200", "255,255,255", "255,170,230", "200,220,255"];
for (let i = 0; i < 70; i++) dots.push({
  x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 2.4,
  v: 0.1 + Math.random() * 0.35, ph: Math.random() * 6.28, c: cols[i % cols.length]
});
(function frame(t) {
  ctx.clearRect(0, 0, W, H);
  for (const p of dots) {
    p.y -= p.v; p.x += Math.sin(t / 1600 + p.ph) * 0.15;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    const a = 0.35 + 0.45 * Math.sin(t / 700 + p.ph);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28);
    ctx.fillStyle = `rgba(${p.c},${Math.max(0.08, a)})`;
    ctx.shadowColor = `rgba(${p.c},.9)`; ctx.shadowBlur = 8; ctx.fill();
  }
  requestAnimationFrame(frame);
})(0);
</script>
